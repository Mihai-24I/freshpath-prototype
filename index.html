<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshPath</title>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <!-- 1. Fonts (Google Fonts) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@700&family=Roboto:wght@400;500;700&display=swap">
  <!-- 2. beer.css 5.0.3: styles + script (Material Symbols Outlined are bundled with it) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
  <!-- 3. Our overrides last, so the Herb Garden variables win -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="light">
  <header>
    <nav>
      <img src="assets/logo-symbol.svg" alt="" width="32" height="32">
      <span class="wordmark h6 small max">FreshPath</span>
      <a id="avatar" class="button circle transparent" href="#/profile" aria-label="Profile"><i>person</i></a>
    </nav>
    <div class="tabs" role="navigation" aria-label="Main">
      <a href="#/" data-tab="overview">Overview</a>
      <a id="tab-second" href="#/tasks" data-tab="tasks">Tasks</a>
      <a href="#/storage" data-tab="storage">Storage</a>
      <a href="#/profile" data-tab="profile">Profile</a>
    </div>
  </header>
  <main id="app" class="responsive"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
